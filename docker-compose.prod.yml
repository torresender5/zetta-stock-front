services:
  front:
    image: torresender5/zettastock-front:latest
    container_name: zettastock-front
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
    networks:
      - zettastock-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zettastock-net:
    external: true