services:
  front:
    image: torresender5/zettastock-front:latest
    container_name: zettastock-front
    restart: unless-stopped
    # app.zettastock.com y dev-api.zettastock.com se sirven por puertos alternos;
    # la landing (zettastock-landing) ocupa el 80/443. Cloudflare apunta a 8443
    # mediante Origin Rules. nginx.prod.conf trae los server blocks de la SPA
    # (port 80 redirect + 443) y el proxy del API (dev-api → zettastock-api:3000).
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
    networks:
      - zettastock-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zettastock-net:
    external: true