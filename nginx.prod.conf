server {
  listen 80;
  listen [::]:80;
  server_name zettastock.com www.zettastock.com dev-api.zettastock.com;
  return 301 https://$host$request_uri;
}

# SPA — zettastock.com
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name zettastock.com www.zettastock.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

# API — dev-api.zettastock.com
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dev-api.zettastock.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream zettastock-api;
    proxy_pass http://$api_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}